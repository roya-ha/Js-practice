<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Checker</title>
</head>
<body>
    <h1>Student Checker</h1>

    <h2>Task 1 - Age Checker</h2>
    <input type="number" id="age" placeholder="Enter your age">
    <button id="ageButton">Check Age</button>
    <p id="ageResult"></p>
 
    <h2>Task 2 - Number Checker</h2>
    <input type="number" id="number" placeholder="Enter a number">
    <button id="numberButton">Check Number</button>
    <p id="numberResult"></p>

    <h2>Task 3 - Grade Checker</h2>
    <input type="number" id="score" placeholder="Enter your score">
    <button id="gradeButton">Check Grade</button>
    <p id="gradeResult"></p>

    <h2>Task 4 - Even or Odd</h2>
    <input type="number" id="evenNumber" placeholder="Enter a number">
    <button id="evenButton">Check button</button>
    <p id="evenResult"></p>

    <h2>Task 5 - Login Checker</h2>
    <input type="text" id="username" placeholder="Enter your username">
    <input type="password" id="password" placeholder="Enter your password">
    <button id="loginButton">Login</button>
    <p id="loginResult"></p>

    <h2>Task 6 - Ternary Operator</h2>
    <input type="number" id="ternaryAge" placeholder="Enter your age">
    <button id="ternaryButton">Check Age</button>
    <p id="ternaryResult"></p>

    <h2>Task 7 - Access Checker</h2>
    <input type="number" id="accessAge" placeholder="Enter your age">
    <label>
        <input type="checkbox" id="hasID">I have an ID
    </label>
    <button id="accessButton">Check Access</button>
    <p id="accessResult"></p>

    <h2>Bonus - Student Result Checker</h2>
    <form id="studentForm">
        <input type="text" id="studentName" placeholder="Student Name"> 
        <input type="number" id="studentScore" placeholder="Score">
        <button type="submit">Check Result</button>
    </form>
    <p id="studentResult"></p>

    <script src="script.js"></script>
</body>
</html>
